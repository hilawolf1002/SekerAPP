services:
  db:
    image: postgres:16-alpine
    container_name: sekerapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sekerapp
    ports:
      - "5432:5432"
    volumes:
      - sekerapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sekerapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sekerapp_postgres_data:
