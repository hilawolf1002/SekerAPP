<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Groups - קבוצות וואטסאפ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
        }
        .loading {
            margin: 1rem 0;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-info {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>קבוצות וואטסאפ</h1>
        <div class="loading">מעביר אותך לקבוצת וואטסאפ...</div>
    </div>

    <script>
        // WhatsApp links array
        const whatsappLinks = [
            'https://chat.whatsapp.com/FuXyh4OrEpV2P3JJbhQmny',
            'https://chat.whatsapp.com/LMw6gMZ0Ldk7fsdVsduc5B',
            'https://chat.whatsapp.com/GpTwSDzxI0B5sMml4RFOH3'
        ];

        // Get random link
        function getCurrentLink() {
            const randomIndex = Math.floor(Math.random() * whatsappLinks.length);
            return whatsappLinks[randomIndex];
        }

        // Redirect immediately
        function redirectToWhatsApp() {
            const link = getCurrentLink();
            window.location.href = link;
        }

        // Start redirect when page loads
        window.addEventListener('load', redirectToWhatsApp);
        

    </script>
</body>
</html>
