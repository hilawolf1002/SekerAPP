<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קבוצות WhatsApp - ניצחון ישראל ו'</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .loading {
            display: none;
            margin-top: 1rem;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #25D366;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 2rem;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>קבוצות WhatsApp</h1>
        <p class="subtitle">הצטרף לקבוצות שלנו ותישאר מעודכן</p>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>מעביר אותך לקבוצה...</p>
        </div>
        
        <div class="footer">
            <p>ניצחון ישראל ו'</p>
        </div>
    </div>

    <script>
        const whatsappGroups = [
            'https://chat.whatsapp.com/EmjgHM2Y1m26lP2sowUchm?mode=ac_t',
            'https://chat.whatsapp.com/KUhtkKJ1nfEIlHCmEMpb0v?mode=ac_t',
            'https://chat.whatsapp.com/FuXyh4OrEpV2P3JJbhQmny?mode=ac_t',
            'https://chat.whatsapp.com/CUnYOBm5kwR2fwNVgn7Kyq?mode=ac_t',
            'https://chat.whatsapp.com/LMw6gMZ0Ldk7fsdVsduc5B?mode=ac_t',
            'https://chat.whatsapp.com/GpTwSDzxI0B5sMml4RFOH3?mode=ac_t'
        ];

        // Auto-redirect immediately when page loads
        window.addEventListener('load', function() {
            // Show loading state
            document.getElementById('loading').style.display = 'block';
            
            // Random delay between 0.5-1.5 seconds for better UX
            const delay = Math.random() * 1000 + 500;
            
            setTimeout(() => {
                // Select random group
                const randomIndex = Math.floor(Math.random() * whatsappGroups.length);
                const selectedGroup = whatsappGroups[randomIndex];
                
                // Redirect to the selected group
                window.location.href = selectedGroup;
            }, delay);
        });
    </script>
</body>
</html>
