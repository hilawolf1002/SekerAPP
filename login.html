<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - SekerApp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WNRFLCEHLT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WNRFLCEHLT');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-50: #f0f9ff;
            --primary-100: #e0f2fe;
            --primary-200: #bae6fd;
            --primary-300: #7dd3fc;
            --primary-400: #38bdf8;
            --primary-500: #0ea5e9;
            --primary-600: #0284c7;
            --primary-700: #0369a1;
            --primary-800: #075985;
            --primary-900: #0c4a6e;
            
            --purple-400: #a855f7;
            --purple-500: #9333ea;
            --purple-600: #7c3aed;
            --purple-700: #6d28d9;
            
            --pink-400: #f472b6;
            --pink-500: #ec4899;
            --pink-600: #db2777;
            
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            
            --dark-bg: #020617;
            --dark-surface: #0f172a;
            --dark-card: #1e293b;
            --dark-border: #334155;
            
            --red-400: #f87171;
            --red-500: #ef4444;
            --red-600: #dc2626;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Enhanced mesh gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 50%, #94a3b8 75%, #64748b 100%);
            z-index: -1;
        }

        /* Floating orbs */
        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #6366f1, transparent);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            top: 60%;
            right: 15%;
            animation-delay: -7s;
        }

        .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #f59e0b, transparent);
            bottom: 20%;
            left: 20%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* Hide orbs on mobile for performance */
        @media (max-width: 768px) {
            .floating-orbs,
            body::before {
                background: #f8fafc;
            }
            
            .orb {
                display: none;
            }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(24px);
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            position: relative;
            animation: slideInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #e2e8f0;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
            letter-spacing: -0.02em;
        }

        .logo img {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
            transition: all 0.3s ease;
        }

        .logo img:hover {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.5));
            transform: scale(1.05);
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
            letter-spacing: -0.01em;
        }

        .header-subtitle {
            opacity: 0.9;
            font-size: 15px;
            position: relative;
            z-index: 2;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 3;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        .login-form {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: -0.01em;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            color: #1e293b;
            font-family: inherit;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: translateY(-1px);
        }

        .form-input.error {
            border-color: #ef4444;
            background: #fef2f2;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .input-icon .form-input {
            padding-left: 52px;
        }

        .input-icon .form-input:focus + i {
            color: #6366f1;
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }

        .form-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .form-error.show {
            display: block;
            animation: fadeInError 0.3s ease-out;
        }

        @keyframes fadeInError {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
            background: #ffffff;
        }

        .checkbox:checked {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: #6366f1;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .forgot-password {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn:disabled:hover {
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
        }

        .divider span {
            background: #ffffff;
            padding: 6px 16px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
        }

        .social-login {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: left 0.5s;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn.google:hover {
            border-color: #ef4444;
            background: #fef2f2;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 28px;
            color: #64748b;
            font-size: 14px;
            padding: 24px 32px;
            border-top: 1px solid #e2e8f0;
        }

        .register-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .terms-link {
            text-align: center;
            margin-top: 16px;
            color: #94a3b8;
            font-size: 12px;
            padding: 0 32px 24px;
        }

        .terms-link a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .terms-link a:hover {
            color: #475569;
            text-decoration: underline;
        }

        /* Loading state */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .login-container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
                max-width: none;
                width: 100%;
            }
            
            .login-header {
                padding: 32px 24px;
            }

            .back-home {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
            
            .login-form {
                padding: 24px;
            }

            .register-link {
                padding: 20px 24px;
            }
            
            .logo {
                font-size: 24px;
            }
            
            .logo img {
                height: 40px;
                width: auto;
            }

            .header-title {
                font-size: 1.4rem;
            }

            .header-subtitle {
                font-size: 14px;
            }

            .form-input {
                padding: 14px 18px;
            }

            .input-icon .form-input {
                padding-left: 48px;
            }

            .input-icon i {
                left: 18px;
                font-size: 15px;
            }

            .password-toggle {
                right: 18px;
                font-size: 15px;
            }

            .submit-btn {
                padding: 15px 28px;
                font-size: 15px;
            }
        }

        /* Smooth transitions for better UX */
        * {
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Floating Orbs -->
    <div class="floating-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="login-container">
        <button class="back-home" id="backHomeBtn">
            <i class="fas fa-arrow-left"></i>
        </button>
        
        <div class="login-header">
            <div class="logo">
                <img src="logo.png" alt="SekerApp Logo" style="height: 48px; width: auto; margin-left: 12px;">
                <span style="font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">SekerApp</span>
            </div>
            <h1 class="header-title">ברוך שובך!</h1>
            <p class="header-subtitle">התחבר לחשבון שלך והמשך ליצור סקרים מדהימים</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">שם משתמש או אימייל</label>
                <div class="input-icon">
                    <input type="text" id="username" class="form-input" placeholder="הכנס את שם המשתמש או האימייל שלך" required autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>
                <div class="form-error" id="usernameError">שם משתמש או אימייל הוא שדה חובה</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">סיסמה</label>
                <div class="input-icon">
                    <input type="password" id="password" class="form-input" placeholder="הכנס את הסיסמה שלך" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-error" id="passwordError">סיסמה היא שדה חובה</div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" class="checkbox">
                    זכור אותי
                </label>
                <a href="#" class="forgot-password" id="forgotPasswordLink">שכחתי סיסמה</a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">התחבר</span>
                <span class="loading">
                    <div class="spinner"></div>
                    מתחבר...
                </span>
            </button>
        </form>

        <div class="divider">
            <span>או התחבר עם</span>
        </div>

        <div class="social-login">
            <a href="/auth/google" class="social-btn google" id="googleBtn">
                <i class="fab fa-google"></i>
                Google
            </a>
        </div>

        <div class="register-link">
            אין לך חשבון? <a href="register.html">הירשם כאן</a>
        </div>
        
        <div class="terms-link">
            <a href="terms.html" target="_blank">תקנון שימוש באתר</a>
        </div>
    </div>

    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Login page loaded');
            
            // Check if user is already logged in (only on login page)
            if (window.location.pathname.includes('login.html')) {
                console.log('Checking existing session...');
                checkExistingSession();
            }
            
            // Auto-fill demo credentials for testing
            if (window.location.search.includes('demo=true')) {
                console.log('Demo mode detected, auto-filling credentials');
                document.getElementById('username').value = 'demo@SekerApp.com';
                document.getElementById('password').value = 'demo123';
            }
            
            // Add event listeners for social buttons
            document.getElementById('googleBtn').addEventListener('click', function(e) {
                console.log('Google login clicked');
                // לא צריך preventDefault - זה ילך ל-URL האמיתי
            });
            
            // Add event listeners for other buttons
            document.getElementById('backHomeBtn').addEventListener('click', function() {
                console.log('Back home clicked');
                window.location.href = '/';
            });
            
            document.getElementById('passwordToggle').addEventListener('click', function() {
                console.log('Password toggle clicked');
                togglePassword('password');
            });
            
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Forgot password clicked');
                showForgotPassword();
            });
            
            console.log('Login page initialized successfully');
        });

        // Real-time validation
        document.getElementById('username').addEventListener('blur', function() {
            if (this.value.trim()) {
                setFieldState('username', 'success');
            }
        });

        document.getElementById('password').addEventListener('blur', function() {
            if (this.value) {
                setFieldState('password', 'success');
            }
        });

        function togglePassword(inputId) {
            try {
                console.log('Toggling password visibility for:', inputId);
                const input = document.getElementById(inputId);
                const toggle = input.nextElementSibling.nextElementSibling;
                const icon = toggle.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                    console.log('Password now visible');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                    console.log('Password now hidden');
                }
            } catch (error) {
                console.error('Error toggling password:', error);
            }
        }

        function showForgotPassword() {
            try {
                console.log('Showing forgot password notification');
                showNotification(
                    'איפוס סיסמה',
                    'הכנס את כתובת האימייל שלך לקבלת הוראות איפוס. זהו דמו - הפונקציונליות תהיה זמינה בגרסה הסופית'
                );
            } catch (error) {
                console.error('Error showing forgot password:', error);
            }
        }

        function validateForm() {
            try {
                console.log('Validating form...');
                let isValid = true;
                const errors = {};

                // Username/Email validation
                const username = document.getElementById('username').value.trim();
                if (!username) {
                    errors.username = 'שם משתמש או אימייל הוא שדה חובה';
                    isValid = false;
                }

                // Password validation
                const password = document.getElementById('password').value;
                if (!password) {
                    errors.password = 'סיסמה היא שדה חובה';
                    isValid = false;
                }

                // Clear all errors
                document.querySelectorAll('.form-error').forEach(error => {
                    error.classList.remove('show');
                });

                // Show specific errors
                Object.keys(errors).forEach(field => {
                    const errorElement = document.getElementById(field + 'Error');
                    if (errorElement) {
                        errorElement.textContent = errors[field];
                        errorElement.classList.add('show');
                    }
                });

                console.log('Form validation result:', isValid);
                return isValid;
            } catch (error) {
                console.error('Error validating form:', error);
                return false;
            }
        }

        function setFieldState(fieldId, state) {
            try {
                console.log('Setting field state:', fieldId, state);
                const input = document.getElementById(fieldId);
                const errorElement = document.getElementById(fieldId + 'Error');
                
                if (input && errorElement) {
                    input.classList.remove('error');
                    if (state === 'error') {
                        input.classList.add('error');
                        errorElement.classList.add('show');
                    } else {
                        errorElement.classList.remove('show');
                    }
                } else {
                    console.log('Field elements not found:', fieldId);
                }
            } catch (error) {
                console.error('Error setting field state:', error);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }

            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const loading = submitBtn.querySelector('.loading');
            
            btnText.style.display = 'none';
            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                // Get form data
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                // Call server login endpoint
                                    const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'include', // Include cookies
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        rememberMe: rememberMe
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.success) {
                        // Store JWT tokens and user data in localStorage
                        if (result.token) {
                            localStorage.setItem('authToken', result.token);
                        }
                        if (result.refreshToken) {
                            localStorage.setItem('refreshToken', result.refreshToken);
                        }
                        if (result.user) {
                            localStorage.setItem('user', JSON.stringify(result.user));
                        }
                        if (result.sessionId) {
                            localStorage.setItem('sessionId', result.sessionId);
                        }
                        
                        // Set authentication flag
                        localStorage.setItem('isAuthenticated', 'true');
                        
                        showNotification(
                            'התחברות הושלמה!',
                            'ברוך הבא בחזרה ל-SekerApp! מעביר אותך לדשבורד...'
                        );
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        showNotification(
                            'שגיאה בהתחברות',
                            result.message || 'שם משתמש או סיסמה שגויים'
                        );
                        
                        // Reset form state
                        btnText.style.display = 'block';
                        loading.classList.remove('show');
                        submitBtn.disabled = false;
                    }
                } else {
                    const errorData = await response.json();
                    showNotification(
                        'שגיאה בהתחברות',
                        errorData.message || 'שגיאה בשרת, נסה שוב'
                    );
                    
                    // Reset form state
                    btnText.style.display = 'block';
                    loading.classList.remove('show');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                
                // For demo purposes, accept any non-empty credentials
                if (username && password) {
                    showNotification(
                        'התחברות הושלמה! (דמו)',
                        'ברוך הבא בחזרה ל-SekerApp! מעביר אותך לדשבורד...'
                    );
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showNotification(
                        'שגיאה בהתחברות',
                        'שם משתמש וסיסמה נדרשים להתחברות'
                    );
                    
                    // Reset form state
                    btnText.style.display = 'block';
                    loading.classList.remove('show');
                    submitBtn.disabled = false;
                }
            }
        });

        // Modern notification system
        function showNotification(title, message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 24px;
                right: 24px;
                background: rgba(30, 41, 59, 0.95);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(14, 165, 233, 0.3);
                border-radius: 12px;
                padding: 16px 20px;
                color: white;
                font-size: 14px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
                transform: translateX(400px);
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                max-width: 280px;
                font-family: 'Inter', sans-serif;
            `;
            
            notification.innerHTML = `
                <div style="font-weight: 700; margin-bottom: 4px; color: var(--primary-400);">${title}</div>
                <div style="color: var(--gray-300); font-size: 13px;">${message}</div>
                <div style="position: absolute; top: 8px; left: 8px; width: 6px; height: 6px; background: var(--emerald-500); border-radius: 50%; animation: pulse 2s infinite;"></div>
            `;
            
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Animate out and remove
            setTimeout(() => {
                notification.style.transform = 'translateX(400px)';
                setTimeout(() => {
                    notification.remove();
                }, 400);
            }, 3500);
        }

        // Add interactive effects for social buttons
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 15;
                const rotateY = (centerX - x) / 15;
                
                this.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
            });

            btn.addEventListener('mouseleave', function() {
                this.style.transform = '';
            });
        });

        // Logout function
        async function logout() {
            try {
                console.log('Logging out user');
                
                // Clear localStorage
                localStorage.removeItem('authToken');
                localStorage.removeItem('refreshToken');
                localStorage.removeItem('user');
                localStorage.removeItem('sessionId');
                localStorage.removeItem('isAuthenticated');
                
                // Call server logout endpoint
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                } catch (error) {
                    console.log('Server logout failed, continuing with client cleanup');
                }
                
                // Redirect to login
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error during logout:', error);
                // Force redirect even if there's an error
                window.location.href = 'login.html';
            }
        }

        // Check if user already has an active session
        async function checkExistingSession() {
            try {
                console.log('Checking existing session...');
                
                // First, check if we have JWT token in localStorage
                const authToken = localStorage.getItem('authToken');
                const userData = localStorage.getItem('user');
                
                if (authToken && userData) {
                    console.log('JWT token found in localStorage');
                    
                    try {
                        // Verify the token is still valid by making a request to the server
                        const response = await fetch('/api/auth/profile', {
                            headers: {
                                'Authorization': `Bearer ${authToken}`
                            }
                        });
                        
                        if (response.ok) {
                            const profileData = await response.json();
                            if (profileData.success) {
                                console.log('Token is valid, user authenticated, redirecting to dashboard');
                                window.location.href = 'dashboard.html';
                                return;
                            }
                        }
                    } catch (error) {
                        console.log('Token validation failed, clearing localStorage');
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('user');
                    }
                }
                
                // If no JWT token or invalid, check server session
                console.log('No valid JWT token, checking server session...');
                const response = await fetch('/api/auth/session', {
                    method: 'GET',
                    credentials: 'include', // Include cookies
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const userData = await response.json();
                    
                    if (userData.isAuthenticated && userData.user) {
                        // Session is still valid, store user data and redirect to dashboard
                        console.log('Valid session found, storing user data and redirecting to dashboard');
                        localStorage.setItem('user', JSON.stringify(userData.user));
                        localStorage.setItem('isAuthenticated', 'true');
                        localStorage.setItem('sessionId', 'session');
                        window.location.href = 'dashboard.html';
                        return;
                    } else {
                        console.log('No valid session found');
                    }
                } else {
                    console.log('Session check failed');
                }
            } catch (error) {
                console.error('Error checking existing session:', error);
                // If there's an error, assume no session
            }
        }

        // Add CSS animations for pulse effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0%, 100% { 
                    transform: scale(1); 
                    opacity: 1; 
                }
                50% { 
                    transform: scale(1.2); 
                    opacity: 0.7; 
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
